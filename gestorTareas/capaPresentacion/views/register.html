<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Registro</h1>
    <form id="register-form" class="task-form">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required />
      </div>
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <div class="form-group">
        <label for="password2">Repetir Contraseña</label>
        <input type="password" id="password2" required />
      </div>
      <button type="submit">Registrarse</button>
    </form>
    <div class="error" id="register-error" style="display:none;"></div>
    <p style="text-align:center;margin-top:1rem;">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </div>
  <script>
    document.getElementById('register-form').onsubmit = async function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const apellido = document.getElementById('apellido').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        document.getElementById('register-error').style.display = 'block';
        document.getElementById('register-error').textContent = 'Las contraseñas no coinciden';
        return;
      }
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, apellido, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/login.html';
      } else {
        document.getElementById('register-error').style.display = 'block';
        document.getElementById('register-error').textContent = data.error || 'Error al registrarse';
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Iniciar Sesión</h1>
    <form id="login-form" class="task-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Ingresar</button>
    </form>
    <div class="error" id="login-error" style="display:none;"></div>
    <p style="text-align:center;margin-top:1rem;">¿No tienes cuenta? <a href="/register.html">Regístrate</a></p>
  </div>
  <script>
    document.getElementById('login-form').onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/index.html';
      } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('login-error').textContent = data.error || 'Error al iniciar sesión';
      }
    };
  </script>
</body>
</html>

# Nombre del flujo de trabajo
name: Node.js CI

# Eventos que disparan el flujo de trabajo
on:
  push:
    branches: [ "main", "monolitico", "tres-capas" ] # Se ejecuta en push a estas ramas
  pull_request:
    branches: [ "main" ] # Se ejecuta en pull requests a main

# Trabajos a ejecutar
jobs:
  build:
    # El tipo de máquina virtual donde se ejecutará el trabajo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Probará en estas versiones de Node.js

    steps:
    # 1. Clona tu repositorio en la máquina virtual
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Configura el entorno de Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: gestorTareas/package-lock.json

    # 3. Instala las dependencias del proyecto
    - name: Install dependencies
      # Es importante indicar el directorio de trabajo si el package.json no está en la raíz
      working-directory: ./gestorTareas
      run: npm install

    # 4. (Opcional) Ejecuta pruebas si las tienes
    # - name: Run tests
    #   working-directory: ./gestorTareas
    #   run: npm test 